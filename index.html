<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css"></link>
</head>
<body>
    <div class="board">
        <div class = "row">
            <div id="1" class="space"></div>
            <div id="2" class="space"></div>
            <div id="3" class="space"></div>
        </div>
        <div class = "row">
            <div id="4" class="space"></div>
            <div id="5" class="space"></div>
            <div id="6" class="space"></div>
        </div>
        <div class = "row">
            <div id="7" class="space"></div>
            <div id="8" class="space"></div>
            <div id="9" class="space"></div>
        </div>
    </div>
    <div class="buttons">
        <button class="start-button" command="show-modal" commandfor="start-game-dialog">
            Start Game
        </button>

        <dialog id="start-game-dialog">
            <form>
                <p>Enter player names. Player one will be X and player two will be O</p>

                <label for="p1Name">Player One Name: </label>
                <input type="text" id="p1Name">

                <label for="p2Name">Player Two Name: </label>
                <input type="text" id="p2Name">

                <div class="form-buttons">
                    <button class="submit-button" type="submit">Submit</button>
                    <button class="close-button">Close</button>
                </div>
            </form>
        </dialog>
        
        <button class="reset-button">Reset</button>
    </div>
</body>
</html>
